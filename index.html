<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoTATo — Pokémon Champions Teambuilder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PoTATo</h1>
  <label>
    Format:
    <select id="format-select">
      <option value="m-b">Regulation M-B (Jun–Sep 2026)</option>
      <option value="m-a">Regulation M-A (Apr–Jun 2026)</option>
    </select>
  </label>
  <label>
    Team:
    <select id="team-select"></select>
    <span id="team-warning" class="team-warning hidden">⚠</span>
  </label>
  <label>
    Language:
    <select id="lang-select"></select>
  </label>
  <div id="header-team"></div>
  <button id="new-team-btn">+ New Team</button>
</header>

<div class="app-wrapper">

<div class="main-sections">
  <!-- Left section — input & research -->
  <div class="section section-left">
    <div class="tab-bar">
      <button class="tab active" data-tab="team-builder">Team Builder</button>
      <button class="tab" data-tab="pokedex">Pokédex</button>
      <button class="tab" data-tab="imports">Imports</button>
    </div>

    <div id="tab-content-team-builder" class="tab-content">
    </div>
    <div id="tab-content-pokedex" class="tab-content hidden">
      <div class="sub-tab-bar">
        <button class="sub-tab active" data-subtab="pokemon">Pokémon</button>
        <button class="sub-tab" data-subtab="moves">Moves</button>
        <button class="sub-tab" data-subtab="abilities">Abilities</button>
        <button class="sub-tab" data-subtab="items">Items</button>
      </div>
      <div id="subtab-content-pokemon" class="subtab-content"></div>
      <div id="subtab-content-moves" class="subtab-content hidden"></div>
      <div id="subtab-content-abilities" class="subtab-content hidden"></div>
      <div id="subtab-content-items" class="subtab-content hidden"></div>
    </div>
    <div id="tab-content-imports" class="tab-content hidden">
      <div class="placeholder">Imports coming soon</div>
    </div>
  </div>

  <!-- Right section — analysis -->
  <div class="section section-right">
    <div class="tab-bar">
      <button class="tab active" data-tab="search-detail">Search Detail</button>
      <button class="tab" data-tab="defensive-coverage">Defensive Coverage</button>
      <button class="tab" data-tab="offensive-coverage">Offensive Coverage</button>
      <button class="tab" data-tab="damage-calc">Damage Calculator</button>
    </div>

    <div id="tab-content-search-detail" class="tab-content">
      <div id="breadcrumb-bar"></div>
      <div id="search-detail-content" class="search-detail-content">
        <div class="placeholder">Click a Pokémon to see details</div>
      </div>
    </div>
    <div id="tab-content-defensive-coverage" class="tab-content hidden">
      <div id="defensive-coverage-content"></div>
    </div>
    <div id="tab-content-offensive-coverage" class="tab-content hidden">
      <div id="offensive-coverage-content"></div>
    </div>
    <div id="tab-content-damage-calc" class="tab-content hidden">
      <div class="placeholder">Damage Calculator coming soon</div>
    </div>
  </div>
</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
