<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoTATo — Pokémon Champions Teambuilder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PoTATo</h1>
  <label>
    Format:
    <select id="format-select">
      <option value="m-a">Regulation M-A (Apr–Jun 2026)</option>
    </select>
  </label>
  <label>
    Team:
    <select id="team-select"></select>
    <span id="team-warning" class="team-warning hidden">⚠</span>
  </label>
  <button id="new-team-btn">+ New Team</button>
</header>

<div id="team-bar"></div>

<!-- Mobile unified tab bar -->
<div id="tab-bar-mobile" class="tab-bar">
  <button class="tab active" data-tab="team-builder" data-side="left">Team</button>
  <button class="tab" data-tab="pokedex" data-side="left">Pokédex</button>
  <button class="tab" data-tab="imports" data-side="left">Imports</button>
  <button class="tab" data-tab="search-detail" data-side="right">Detail</button>
  <button class="tab" data-tab="defensive-coverage" data-side="right">Def.</button>
  <button class="tab" data-tab="move-coverage" data-side="right">Moves</button>
  <button class="tab" data-tab="damage-calc" data-side="right">Calc</button>
</div>

<div class="main-sections">
  <!-- Left section — input & research -->
  <div class="section section-left">
    <div class="tab-bar tab-bar-desktop">
      <button class="tab active" data-tab="team-builder" data-side="left">Team Builder</button>
      <button class="tab" data-tab="pokedex" data-side="left">Pokédex</button>
      <button class="tab" data-tab="imports" data-side="left">Imports</button>
    </div>

    <div id="tab-content-team-builder" class="tab-content">
      <div class="placeholder">Select a team slot to add Pokémon</div>
    </div>
    <div id="tab-content-pokedex" class="tab-content">
      <div class="sub-tab-bar">
        <button class="sub-tab active" data-subtab="pokemon">Pokémon</button>
        <button class="sub-tab" data-subtab="moves">Moves</button>
        <button class="sub-tab" data-subtab="abilities">Abilities</button>
      </div>
      <div id="subtab-content-pokemon" class="subtab-content">
        <input id="filter-input" type="text" placeholder="Search Pokémon…" autocomplete="off">
        <div id="pokemon-grid" role="list"></div>
      </div>
      <div id="subtab-content-moves" class="subtab-content hidden">
        <div class="placeholder">Moves coming soon</div>
      </div>
      <div id="subtab-content-abilities" class="subtab-content hidden">
        <div class="placeholder">Abilities coming soon</div>
      </div>
    </div>
    <div id="tab-content-imports" class="tab-content hidden">
      <div class="placeholder">Imports coming soon</div>
    </div>
  </div>

  <!-- Right section — analysis -->
  <div class="section section-right">
    <div class="tab-bar tab-bar-desktop">
      <button class="tab active" data-tab="search-detail" data-side="right">Search Detail</button>
      <button class="tab" data-tab="defensive-coverage" data-side="right">Defensive Coverage</button>
      <button class="tab" data-tab="move-coverage" data-side="right">Move Type Coverage</button>
      <button class="tab" data-tab="damage-calc" data-side="right">Damage Calculator</button>
    </div>

    <div id="tab-content-search-detail" class="tab-content">
      <div id="search-detail-content" class="search-detail-content">
        <div class="placeholder">Click a Pokémon to see details</div>
      </div>
    </div>
    <div id="tab-content-defensive-coverage" class="tab-content hidden">
      <div class="placeholder">Defensive Coverage coming soon</div>
    </div>
    <div id="tab-content-move-coverage" class="tab-content hidden">
      <div class="placeholder">Move Type Coverage coming soon</div>
    </div>
    <div id="tab-content-damage-calc" class="tab-content hidden">
      <div class="placeholder">Damage Calculator coming soon</div>
    </div>
  </div>
</div>

<script type="module" src="dist/app.js"></script>
</body>
</html>
